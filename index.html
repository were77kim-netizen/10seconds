<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>10 Second Challenge</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background:
    radial-gradient(circle at 50% 25%, #25334d 0%, #111a2c 40%, #070b13 100%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game {
  width: min(92%, 480px);
  text-align: center;
}

/* 상단 */
.brand {
  color: #ff2d55;
  letter-spacing: 3px;
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: clamp(34px, 10vw, 54px);
  font-weight: 900;
  line-height: 0.95;
}

.subtitle {
  color: #aeb8c9;
  margin: 18px 0 38px;
}

/* 이름 */
.name-area {
  margin-bottom: 28px;
}

input {
  width: 100%;
  padding: 17px;
  border-radius: 12px;
  border: 1px solid #364158;
  background: rgba(255,255,255,.06);
  color: white;
  text-align: center;
  font-size: 17px;
  outline: none;
}

input:focus {
  border-color: #ff2d55;
}

/* 타이머 */
.timer-label {
  color: #8995a9;
  font-size: 13px;
  letter-spacing: 2px;
}

#timer {
  font-size: clamp(60px, 20vw, 92px);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  margin: 10px 0 34px;
  min-height: 105px;
}

/* 버튼 */
#mainBtn {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  border: 0;
  background: linear-gradient(145deg, #ff1744, #c40031);
  color: white;
  font-size: 29px;
  font-weight: 900;
  cursor: pointer;
  box-shadow:
    0 0 0 10px rgba(255,23,68,.08),
    0 0 50px rgba(255,23,68,.35);
  transition: .15s;
  touch-action: manipulation;
}

#mainBtn:active {
  transform: scale(.95);
}

#mainBtn.stop {
  background: linear-gradient(145deg, #00d47b, #008c58);
  box-shadow:
    0 0 0 10px rgba(0,212,123,.08),
    0 0 50px rgba(0,212,123,.3);
}

/* 결과 */
#result {
  margin-top: 32px;
  min-height: 110px;
}

.result-title {
  color: #96a1b4;
  font-size: 14px;
}

.result-time {
  font-size: 38px;
  font-weight: 800;
  margin: 7px;
}

.error {
  color: #ffcc00;
  font-size: 18px;
  font-weight: 700;
}

/* 재도전 */
#retry {
  display: none;
  margin: 22px auto 0;
  background: transparent;
  color: #abb6c7;
  border: 1px solid #455066;
  border-radius: 30px;
  padding: 12px 25px;
  cursor: pointer;
}

/* 안내 */
.guide {
  margin-top: 45px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,.1);
  font-size: 13px;
  color: #738096;
  line-height: 1.7;
}

.target {
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="game">

  <div class="brand">HVAC ENGINEERING SEMINAR</div>

  <h1>10 SECOND<br>CHALLENGE</h1>

  <div class="subtitle">
    Can you stop exactly at <b>10.000</b> seconds?
  </div>

  <div class="name-area">
    <input
      id="playerName"
      maxlength="20"
      placeholder="이름을 입력하세요">
  </div>

  <div class="timer-label">
    TARGET TIME
  </div>

  <div id="timer">
    10.000
  </div>

  <button id="mainBtn">
    START
  </button>

  <div id="result"></div>

  <button id="retry">
    ↻ 다시 도전
  </button>

  <div class="guide">
    START 버튼을 누르면 시간이 시작됩니다.<br>
    잠시 후 타이머가 사라집니다.<br>
    <span class="target">정확히 10초</span>라고 생각되는 순간 STOP!
  </div>

</div>


<script>

const TARGET = 10000;      // 10초
const HIDE_AFTER = 1000;   // 1초 후 화면에서 시간 숨김

let running = false;
let startTime = 0;
let animationId;

const timer =
  document.getElementById("timer");

const mainBtn =
  document.getElementById("mainBtn");

const result =
  document.getElementById("result");

const retry =
  document.getElementById("retry");

const playerName =
  document.getElementById("playerName");


function formatTime(ms) {

  return (ms / 1000).toFixed(3);

}


function updateTimer() {

  if (!running) return;

  const elapsed =
    performance.now() - startTime;

  if (elapsed < HIDE_AFTER) {

    timer.textContent =
      formatTime(elapsed);

  } else {

    timer.textContent = "•••";

  }

  animationId =
    requestAnimationFrame(updateTimer);

}


function startGame() {

  if (!playerName.value.trim()) {

    alert("참가자 이름을 입력해주세요.");
    playerName.focus();

    return;
  }


  running = true;

  startTime =
    performance.now();


  result.innerHTML = "";

  retry.style.display =
    "none";


  playerName.disabled =
    true;


  mainBtn.textContent =
    "STOP";

  mainBtn.classList.add(
    "stop"
  );


  timer.textContent =
    "0.000";


  animationId =
    requestAnimationFrame(updateTimer);

}


function stopGame() {

  running = false;

  cancelAnimationFrame(
    animationId
  );


  const elapsed =
    performance.now() - startTime;


  const difference =
    elapsed - TARGET;


  const absoluteDifference =
    Math.abs(difference);


  timer.textContent =
    formatTime(elapsed);


  let message = "";


  if (absoluteDifference <= 10) {

    message = "🏆 PERFECT!";

  }

  else if (absoluteDifference <= 50) {

    message = "🔥 AMAZING!";

  }

  else if (absoluteDifference <= 100) {

    message = "👏 GREAT!";

  }

  else if (absoluteDifference <= 300) {

    message = "👍 GOOD!";

  }

  else {

    message = "한 번 더 도전해보세요!";

  }


  const sign =
    difference >= 0
    ? "+"
    : "-";


  result.innerHTML = `

    <div class="result-title">
      ${playerName.value}님의 기록
    </div>

    <div class="result-time">
      ${formatTime(elapsed)}초
    </div>

    <div class="error">
      오차 ${sign}${formatTime(
        absoluteDifference
      )}초
    </div>

    <div style="
      margin-top:12px;
      font-weight:bold;
      color:white;
    ">
      ${message}
    </div>

  `;


  mainBtn.style.display =
    "none";


  retry.style.display =
    "block";

}


function resetGame() {

  running = false;

  timer.textContent =
    "10.000";


  result.innerHTML =
    "";


  playerName.disabled =
    false;


  mainBtn.textContent =
    "START";


  mainBtn.classList.remove(
    "stop"
  );


  mainBtn.style.display =
    "inline-block";


  retry.style.display =
    "none";

}


mainBtn.addEventListener(
  "click",
  function() {

    if (!running) {

      startGame();

    } else {

      stopGame();

    }

  }
);


retry.addEventListener(
  "click",
  resetGame
);

</script>

</body>
</html>
